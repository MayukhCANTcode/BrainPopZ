services:
  - type: web
    name: brainpopz
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false

